<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Δελτίο Εργασίας - Promed Hellas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #008080;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .logo-img {
            max-height: 70px;
            width: auto;
        }
        .company-details {
            text-align: right;
            font-size: 13px;
            line-height: 1.4;
        }
        h2 {
            text-align: center;
            color: #008080;
            margin-top: 0;
        }
        .auto-fill-box {
            background-color: #e6f2f2;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #b2d8d8;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input, select, textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .signature-section {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .sig-box {
            flex: 1;
            min-width: 250px;
            border: 1px dashed #999;
            padding: 10px;
            border-radius: 6px;
            background: #fafafa;
            text-align: center;
        }
        .stamp-box {
            margin-top: 20px;
            border: 1px dashed #999;
            padding: 15px;
            border-radius: 6px;
            background: #fafafa;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            background: #fff;
            touch-action: none;
            width: 100%;
            height: 120px;
            border-radius: 4px;
        }
        .btn-clear {
            margin-top: 5px;
            padding: 4px 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-print {
            display: block;
            width: 100%;
            padding: 15px;
            background: #008080;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
        .btn-print:hover {
            background: #006666;
        }

        @media print {
            body { background: white; margin: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .auto-fill-box, .btn-clear, .btn-print, input[type="file"] { display: none !important; }
            input, select, textarea { border: 1px solid #666 !important; background: transparent !important; }
            canvas { border: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://lh3.googleusercontent.com/d/1v8OhY0FGFLElFrP1b_FYhpIA_a8ql4FT" alt="PROMED Hellas" class="logo-img">
        <div class="company-details">
            <strong>Promed Hellas Ltd</strong><br>
            Πάροδος Ασκληπιού, Θεσσαλονίκη 57003<br>
            Τηλ: 2310475967 | Fax: 2310 927438<br>
            e-mail: sales@promed-hellas.gr
        </div>
    </div>

    <h2>ΔΕΛΤΙΟ ΕΡΓΑΣΙΑΣ</h2>

    <div class="auto-fill-box">
        <label for="presetSelect">⚡ Γρήγορη Επιλογή Αποθηκευμένου Πελάτη:</label>
        <select id="presetSelect" onchange="autoFillCustomer()" oninput="autoFillCustomer()">
            <option value="">-- Επιλέξτε πελάτη για αυτόματη συμπλήρωση --</option>
            <option value="euromedica_kifisia">Euromedica Κηφισίας</option>
        </select>
    </div>

    <form id="deltioForm">
        <div class="form-grid">
            <div class="form-group">
                <label>Πελάτης:</label>
                <input type="text" id="clientName">
            </div>
            <div class="form-group">
                <label>Ν° Δελτίου:</label>
                <input type="text" id="deltioNo">
            </div>
            <div class="form-group full-width">
                <label>Διεύθυνση:</label>
                <input type="text" id="address">
            </div>
            <div class="form-group">
                <label>Πόλη:</label>
                <input type="text" id="city">
            </div>
            <div class="form-group">
                <label>Τηλέφωνο:</label>
                <input type="text" id="phone">
            </div>
            <div class="form-group">
                <label>Α.Φ.Μ.:</label>
                <input type="text" id="afm">
            </div>
            <div class="form-group">
                <label>Δ.Ο.Υ.:</label>
                <input type="text" id="doy">
            </div>
            <div class="form-group">
                <label>Ημερομηνία:</label>
                <input type="date" id="date">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Σύστημα:</label>
                <input type="text" id="system">
            </div>
            <div class="form-group">
                <label>Serial No:</label>
                <input type="text" id="serialNo">
            </div>
            <div class="form-group">
                <label>Οίκος:</label>
                <input type="text" id="oikos">
            </div>
            <div class="form-group">
                <label>Ώρα Έναρξης:</label>
                <input type="time" id="startTime">
            </div>
            <div class="form-group">
                <label>Ώρα Λήξης:</label>
                <input type="time" id="endTime">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group full-width">
                <label>Αιτία Επίσκεψης:</label>
                <input type="text" id="reason">
            </div>
            <div class="form-group full-width">
                <label>Περιγραφή Εργασίας:</label>
                <textarea id="workDescription"></textarea>
            </div>
        </div>

        <!-- Πλαίσιο Σφραγίδας -->
        <div class="stamp-box">
            <label>Χώρος Σφραγίδας</label>
            <input type="file" id="stampInput" accept="image/*" onchange="previewStamp(event)" style="margin-top: 8px;">
            <div id="stampPreviewContainer" style="margin-top: 10px;"></div>
        </div>

        <div class="signature-section">
            <div class="sig-box" id="clientCanvasContainer">
                <button type="button" class="btn-clear" onclick="clearCanvas('clientCanvas')">Καθαρισμός</button>
                <canvas id="clientCanvas"></canvas>
                <label>Υπογραφή Πελάτη</label>
            </div>

            <div class="sig-box" id="techCanvasContainer">
                <button type="button" class="btn-clear" onclick="clearCanvas('techCanvas')">Καθαρισμός</button>
                <canvas id="techCanvas"></canvas>
                <label>Υπογραφή Τεχνικού</label>
            </div>
        </div>

        <button type="button" class="btn-print" onclick="printDirectly()">Εκτύπωση / Αποθήκευση PDF</button>
    </form>
</div>

<script>
    // 1. Αυτόματη συμπλήρωση Πελατών
    const customers = {
        euromedica_kifisia: {
            name: "Euromedica Κηφισίας",
            address: "Λ. Κηφισίας 243",
            city: "Κηφισιά",
            phone: "",
            afm: "",
            doy: "",
            system: "Panorama",
            serialNo: "37160",
            oikos: "Philips"
        }
    };

    function autoFillCustomer() {
        const selected = document.getElementById('presetSelect').value;
        if (selected && customers[selected]) {
            const data = customers[selected];
            document.getElementById('clientName').value = data.name || '';
            document.getElementById('address').value = data.address || '';
            document.getElementById('city').value = data.city || '';
            document.getElementById('phone').value = data.phone || '';
            document.getElementById('afm').value = data.afm || '';
            document.getElementById('doy').value = data.doy || '';
            document.getElementById('system').value = data.system || '';
            document.getElementById('serialNo').value = data.serialNo || '';
            document.getElementById('oikos').value = data.oikos || '';
        }
    }

    // Προεπισκόπηση Σφραγίδας
    function previewStamp(event) {
        const file = event.target.files[0];
        const container = document.getElementById('stampPreviewContainer');
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                container.innerHTML = `<img src="${e.target.result}" style="max-height: 100px; max-width: 100%; object-fit: contain;" alt="Σφραγίδα">`;
            }
            reader.readAsDataURL(file);
        } else {
            container.innerHTML = '';
        }
    }

    // 2. Setup Canvas Υπογραφών (με υποστήριξη Αφής / Touch)
    function setupCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        let isDrawing = false;

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            if (e.type === 'touchstart') e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            if (e.type === 'touchmove') e.preventDefault();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
    }

    function clearCanvas(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    window.onload = function() {
        setupCanvas('clientCanvas');
        setupCanvas('techCanvas');
        document.getElementById('date').valueAsDate = new Date();
    };

    // 3. Ασφαλής Εκτύπωση & Μετατροπή Canvas σε Εικόνες για το iPad
    function printDirectly() {
        const clientCanvas = document.getElementById('clientCanvas');
        const techCanvas = document.getElementById('techCanvas');
        
        if (clientCanvas) {
            const dataURL = clientCanvas.toDataURL('image/png');
            const container = document.getElementById('clientCanvasContainer');
            if (container) {
                container.innerHTML = `<img src="${dataURL}" style="width:100%; height:120px; object-fit:contain; display:block;" alt="Υπογραφή Πελάτη"><label>Υπογραφή Πελάτη</label>`;
            }
        }

        if (techCanvas) {
            const dataURL = techCanvas.toDataURL('image/png');
            const container = document.getElementById('techCanvasContainer');
            if (container) {
                container.innerHTML = `<img src="${dataURL}" style="width:100%; height:120px; object-fit:contain; display:block;" alt="Υπογραφή Τεχνικού"><label>Υπογραφή Τεχνικού</label>`;
            }
        }

        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            if (input.type !== 'file' && input.type !== 'button') {
                input.setAttribute('value', input.value);
                if (input.tagName.toLowerCase() === 'textarea') {
                    input.textContent = input.value;
                }
            }
        });

        setTimeout(function() {
            window.print();
        }, 400);

        setTimeout(function() {
            location.reload();
        }, 2000);
    }
</script>

</body>
</html>
